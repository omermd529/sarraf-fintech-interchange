name: Backend CI

on:
    push:
        branches: [development]
        paths:
            - 'backend/**'
            - '.github/workflows/backend-dev.yml'
            - '!gitops/**'

env:
    PROJECT_ID: omerops-sarraf-dev
    REGION: me-central1
    REPO_NAME: sarraf-docker-repo
    IMAGE_NAME: sarraf-api
    CLUSTER_NAME: sarraf-cluster-dev

jobs:
    build-scan-push:
        name: Build, Scan, and Push Image
        runs-on: ubuntu-latest
        permissions:
            contents: write
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Authenticate to Google Cloud
              id: auth
              uses: google-github-actions/auth@v2
              with:
                  workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
                  service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

            - name: Setup Cloud SDK
              uses: google-github-actions/setup-gcloud@v2

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                terraform_wrapper: false

            - name: Configure Docker for artifact registry
              run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

            - name: Build Docker Image
              run: docker build -t sarraf-api:${{ github.sha }} ./backend

            - name: Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@master
              with:
                  image-ref: 'sarraf-api:${{ github.sha }}'
                  format: 'table'
                  exit-code: '1'
                  ignore-unfixed: true
                  vuln-type: 'os,library'
                  severity: 'CRITICAL,HIGH'

            - name: Check and Push Docker Image
              run: |
                  REMOTE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
                  if gcloud artifacts docker images describe "$REMOTE_TAG" > /dev/null 2>&1; then
                    echo "Tag ${{ github.sha }} already exists. Skipping push."
                  else
                    docker tag sarraf-api:${{ github.sha }} "$REMOTE_TAG"
                    docker push "$REMOTE_TAG"
                  fi

            # --- Database Migrations (still needs cluster access) ---
            - name: Fetch Terraform Outputs
              id: tf_outputs
              run: |
                cd terraform/environments/dev
                terraform init
                echo "DB_IP=$(terraform output -raw database_ip)" >> $GITHUB_OUTPUT

            - name: Get GKE Credentials
              uses: google-github-actions/get-gke-credentials@v2
              with:
                  cluster_name: ${{ env.CLUSTER_NAME }}
                  location: ${{ env.REGION }}

            - name: Run Database Migrations
              run: |
                NAMESPACE="sarraf-dev"
                DB_PRIVATE_IP="${{ steps.tf_outputs.outputs.DB_IP }}"
                kubectl create configmap sarraf-migrations-cm \
                  --from-file=backend/migrations/ \
                  -n $NAMESPACE \
                  --dry-run=client -o yaml | kubectl apply -f -
                sed -i "s|10.20.0.3|$DB_PRIVATE_IP|g" backend/k8s/migration-job.yaml
                kubectl delete job sarraf-db-migrate -n $NAMESPACE --ignore-not-found=true
                kubectl apply -f backend/k8s/migration-job.yaml
                kubectl wait --for=condition=complete job/sarraf-db-migrate -n $NAMESPACE --timeout=180s

            # --- GitOps: Update image tag → ArgoCD auto-syncs ---
            - name: Update GitOps image tag
              run: |
                cd gitops/overlays/gke-dev
                sed -i "s|newTag:.*|newTag: ${{ github.sha }}|g" kustomization.yaml
                # Only update the sarraf-api image tag
                sed -i '/name: sarraf-api/{n;s|newName:.*|newName: '"${{ env.REGION }}"'-docker.pkg.dev/'"${{ env.PROJECT_ID }}"'/'"${{ env.REPO_NAME }}"'/'"${{ env.IMAGE_NAME }}"'|;}' kustomization.yaml

            - name: Commit and Push GitOps update
              run: |
                git config user.name "github-actions[bot]"
                git config user.email "github-actions[bot]@users.noreply.github.com"
                git add gitops/overlays/gke-dev/kustomization.yaml
                git diff --cached --quiet || git commit -m "ci: update sarraf-api image to ${{ github.sha }}"
                git push
