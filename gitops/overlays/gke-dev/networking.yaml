apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: sarraf-gateway
  namespace: sarraf-dev
  annotations:
    networking.gke.io/certmap: sarraf-cert-map
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:
  - type: NamedAddress
    value: sarraf-static-ip
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      options:
        networking.gke.io/pre-shared-certs: ""
    allowedRoutes:
      namespaces:
        from: Same
  - name: http-redirect
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sarraf-frontend-route
  namespace: sarraf-dev
spec:
  parentRefs:
  - name: sarraf-gateway
    sectionName: https
  hostnames:
  - dev.sarraf.omerops.com
  rules:
  - backendRefs:
    - name: sarraf-frontend-service
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sarraf-backend-route
  namespace: sarraf-dev
spec:
  parentRefs:
  - name: sarraf-gateway
    sectionName: https
  hostnames:
  - dev-api.omerops.com
  rules:
  - backendRefs:
    - name: sarraf-backend-service
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sarraf-http-redirect
  namespace: sarraf-dev
spec:
  parentRefs:
  - name: sarraf-gateway
    sectionName: http-redirect
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-route
  namespace: sarraf-dev
spec:
  parentRefs:
  - name: sarraf-gateway
    sectionName: https
  hostnames:
  - dev-grafana.omerops.com
  rules:
  - backendRefs:
    - name: grafana-service
      port: 80
