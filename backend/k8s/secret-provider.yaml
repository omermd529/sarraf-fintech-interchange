apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: sarraf-db-secrets
spec:
  provider: gke
  parameters:
    secrets: |  
      - resourceName: "projects/omerops-sarraf-dev/secrets/sarraf-db-password/versions/latest"
        fileName: "db_password"

    secretObjects: |
      - secretName: sarraf-db-password-sync
        type: Opaque
        data:
        - objectName: "db_password"
          key: "password"
          