apiVersion: apps/v1
kind: Deployment
metadata:
  name: sarraf-backend
  labels:
    app: sarraf-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sarraf-backend
  template:
    metadata:
      labels:
        app: sarraf-backend
    spec:
      terminationGracePeriodSeconds: 25 
      # Links the KSA to your Google Service Account via Workload Identity
      serviceAccountName: sarraf-backend-ksa
      nodeSelector:
        cloud.google.com/gke-spot: "true"
      containers:
      - name: sarraf-api
        image: me-central1-docker.pkg.dev/omerops-sarraf-dev/sarraf-docker-repo/sarraf-api:latest 
        # Crucial for 'latest' tags to ensure the node pulls the new build from Artifact Registry
        imagePullPolicy: Always 
        ports:
        - containerPort: 8080
        
        env:
        - name: DB_HOST
          value: "DATABASE_IP_PLACEHOLDER"
        - name: DB_NAME
          value: "sarraf_interchange"
        - name: DB_USER
          value: "sarraf_admin"
        - name: DB_PORT
          value: "5432"
        - name: DB_PASSWORD_FILE
          value: "/var/secrets/dbpassword.txt"

        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"

        # GKE will restart the pod if /healthz stops responding
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 15
          periodSeconds: 20
        # GKE will stop sending traffic if /healthz is failing
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10

        volumeMounts:
        - name: secrets-store-inline
          # Standardized path; ensure your Go code looks here for the secret file if needed
          mountPath: "/var/secrets"
          readOnly: true

      volumes:
        - name: secrets-store-inline
          csi:
            # GKE Autopilot specific driver name
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "sarraf-db-secrets"
              