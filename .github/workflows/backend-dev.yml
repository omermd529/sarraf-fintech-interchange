name: Backend Dev Deploy

on:
    push:
        branches: [development]
        paths:
            - 'backend/**'

env:
    PROJECT_ID: omerops-sarraf-dev
    REGION: me-central1
    REPO_NAME: sarraf-docker-repo
    IMAGE_NAME: sarraf-api
    CLUSTER_NAME: sarraf-cluster-dev

jobs:
    build-and-deploy:
        name: Build, Scan, and Deploy to GKE
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Authenticate to Google Cloud
              id: auth
              uses: google-github-actions/auth@v2
              with:
                  workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
                  service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

            - name: Setup Cloud SDK
              uses: google-github-actions/setup-gcloud@v2

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                terraform_wrapper: false

            - name: Configure Docker for artifact registry
              run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

            - name: Build Local Docker Image
              run: |
                  docker build -t sarraf-api:${{ github.sha }} ./backend

            - name: Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@master
              with:
                  image-ref: 'sarraf-api:${{ github.sha }}'
                  format: 'table'
                  exit-code: '1'
                  ignore-unfixed: true
                  vuln-type: 'os,library'
                  severity: 'CRITICAL,HIGH'

            # --- SMART PUSH: Skips if tag exists to avoid Immutability Error ---
            - name: Check and Push Docker Image
              run: |
                  REMOTE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
                  
                  # Use gcloud to check if the specific tag already exists in the registry
                  if gcloud artifacts docker images describe "$REMOTE_TAG" > /dev/null 2>&1; then
                    echo "Tag ${{ github.sha }} already exists. Skipping push to respect Immutability."
                  else
                    echo "Tag not found. Pushing new image..."
                    docker tag sarraf-api:${{ github.sha }} "$REMOTE_TAG"
                    docker push "$REMOTE_TAG"
                  fi

            - name: Fetch Terraform Outputs
              id: tf_outputs
              run: |
                cd terraform/environments/dev
                terraform init
                echo "DB_IP=$(terraform output -raw database_ip)" >> $GITHUB_OUTPUT
                echo "DB_CONN_NAME=$(terraform output -raw database_connection_name)" >> $GITHUB_OUTPUT
                echo "GSA_EMAIL=$(terraform output -raw backend_gsa_email)" >> $GITHUB_OUTPUT

            - name: Get GKE Credentials
              uses: google-github-actions/get-gke-credentials@v2
              with:
                  cluster_name: ${{ env.CLUSTER_NAME }}
                  location: ${{ env.REGION }}

            - name: Sync DB Secret to Kubernetes
              run: |
                NAMESPACE="sarraf-dev"
                DB_PASS=$(gcloud secrets versions access latest --secret=sarraf-db-password --project=${{ env.PROJECT_ID }})
                kubectl create secret generic sarraf-db-password-sync \
                  --from-literal=password="$DB_PASS" \
                  -n $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -

            - name: Run Database Migrations
              run: |
                NAMESPACE="sarraf-dev"
                DB_PRIVATE_IP="${{ steps.tf_outputs.outputs.DB_IP }}"
                
                # Create ConfigMap from the migrations folder
                kubectl create configmap sarraf-migrations-cm --from-file=backend/migrations/ -n $NAMESPACE --dry-run=client -o yaml | kubectl apply -f -
                
                # Inject namespace and DB IP into migration job manifest
                sed -i "s|NAMESPACE_PLACEHOLDER|$NAMESPACE|g" backend/k8s/migration-job.yaml
                sed -i "s|DATABASE_IP_PLACEHOLDER|$DB_PRIVATE_IP|g" backend/k8s/migration-job.yaml
                
                # Delete previous job if it exists (jobs are immutable)
                kubectl delete job sarraf-db-migrate -n $NAMESPACE --ignore-not-found
                
                # Run the Migration Job
                kubectl apply -f backend/k8s/migration-job.yaml
                
                # Wait for the job to complete (Autopilot may need time to provision a node)
                kubectl wait --for=condition=complete job/sarraf-db-migrate -n $NAMESPACE --timeout=300s

            - name: Deploy to GKE
              run: |
                IMAGE_FULL_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
                DB_CONN_NAME="${{ steps.tf_outputs.outputs.DB_CONN_NAME }}"
                GSA_EMAIL="${{ steps.tf_outputs.outputs.GSA_EMAIL }}"
                NAMESPACE="sarraf-dev"
                
                # Injection
                sed -i "s|IMAGE_PLACEHOLDER|$IMAGE_FULL_PATH|g" backend/k8s/deployment.yaml
                sed -i "s|DB_CONNECTION_NAME_PLACEHOLDER|$DB_CONN_NAME|g" backend/k8s/deployment.yaml
                sed -i "s|GSA_EMAIL_PLACEHOLDER|$GSA_EMAIL|g" backend/k8s/deployment.yaml
                sed -i "s|NAMESPACE_PLACEHOLDER|$NAMESPACE|g" backend/k8s/deployment.yaml
                sed -i "s|NAMESPACE_PLACEHOLDER|$NAMESPACE|g" backend/k8s/service.yaml
                sed -i "s|NAMESPACE_PLACEHOLDER|$NAMESPACE|g" backend/k8s/secret-provider.yaml
                sed -i "s|NAMESPACE_PLACEHOLDER|$NAMESPACE|g" backend/k8s/namespace.yaml
                sed -i "s|NAMESPACE_PLACEHOLDER|$NAMESPACE|g" backend/k8s/serviceaccount.yaml
                
                # Create namespace first, then apply all resources
                kubectl apply -f backend/k8s/namespace.yaml
                kubectl apply -f backend/k8s/
                kubectl rollout status deployment/sarraf-backend -n $NAMESPACE --timeout=300s