apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: sarraf-gateway
  namespace: sarraf-dev
  annotations:
    networking.gke.io/certmap: sarraf-cert-map
spec:
  gatewayClassName: gke-l7-global-external-managed
  addresses:
  - type: NamedAddress
    value: sarraf-static-ip
  listeners:
  - name: https
    protocol: HTTPS
    port: 443
    tls:
      mode: Terminate
      options:
        networking.gke.io/pre-shared-certs: ""
    allowedRoutes:
      namespaces:
        from: Same
  - name: http-redirect
    protocol: HTTP
    port: 80
    allowedRoutes:
      namespaces:
        from: Same
