name: Backend Dev Deploy

on:
    push:
        branches: [development]
        paths:
            - 'backend/**'

env:
    PROJECT_ID: omerops-sarraf-dev
    REGION: me-central1
    REPO_NAME: sarraf-docker-repo
    IMAGE_NAME: sarraf-api
    CLUSTER_NAME: sarraf-cluster-dev

jobs:
    build-and-deploy:
        name: Build, Scan, and Deploy to GKE
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Authenticate to Google Cloud
              id: auth
              uses: google-github-actions/auth@v2
              with:
                  workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
                  service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

            - name: Setup Cloud SDK
              uses: google-github-actions/setup-gcloud@v2
              
            - name: Configure Docker for artifact registry
              run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

            # --- ADDED: Install Terraform CLI ---
            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                terraform_wrapper: false # Ensures clean output for 'sed'

            - name: Build Local Docker Image
              run: |
                  docker build -t sarraf-api:${{ github.sha }} ./backend

            - name: Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@master
              with:
                  image-ref: 'sarraf-api:${{ github.sha }}'
                  format: 'table'
                  exit-code: '1'
                  ignore-unfixed: true
                  vuln-type: 'os,library'
                  severity: 'CRITICAL,HIGH'

            - name: Push Docker Image to Registry
              run: |
                  REMOTE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
                  docker tag sarraf-api:${{ github.sha }} $REMOTE_TAG
                  docker push $REMOTE_TAG

            # --- UPDATED: Proper Init to fetch Remote State ---
            - name: Fetch DB IP from Terraform
              id: fetch_db_ip
              run: |
                cd terraform/environments/dev
                terraform init # Removed -backend=false to ensure it can reach your state bucket
                DB_IP=$(terraform output -raw database_ip)
                echo "DB_IP=$DB_IP" >> $GITHUB_OUTPUT

            - name: Get GKE Credentials
              uses: google-github-actions/get-gke-credentials@v2
              with:
                  cluster_name: ${{ env.CLUSTER_NAME }}
                  location: ${{ env.REGION }}

            - name: Deploy to GKE
              run: |
                IMAGE_FULL_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
                DB_PRIVATE_IP="${{ steps.fetch_db_ip.outputs.DB_IP }}"
                
                # Use | as a delimiter in sed because the image path contains /
                sed -i "s|IMAGE_PLACEHOLDER|$IMAGE_FULL_PATH|g" backend/k8s/deployment.yaml
                sed -i "s|DATABASE_IP_PLACEHOLDER|$DB_PRIVATE_IP|g" backend/k8s/deployment.yaml
                
                kubectl apply -f backend/k8s/
                kubectl rollout status deployment/sarraf-backend --timeout=300s