apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sarraf-frontend-route
  namespace: sarraf-dev
spec:
  parentRefs:
  - name: sarraf-gateway
    sectionName: https
  hostnames:
  - sarraf.omerops.com
  - omerops.com
  rules:
  - backendRefs:
    - name: sarraf-frontend-service
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sarraf-backend-route
  namespace: sarraf-dev
spec:
  parentRefs:
  - name: sarraf-gateway
    sectionName: https
  hostnames:
  - api.omerops.com
  rules:
  - backendRefs:
    - name: sarraf-backend-service
      port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sarraf-http-redirect
  namespace: sarraf-dev
spec:
  parentRefs:
  - name: sarraf-gateway
    sectionName: http-redirect
  rules:
  - filters:
    - type: RequestRedirect
      requestRedirect:
        scheme: https
        statusCode: 301
