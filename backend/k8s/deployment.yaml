apiVersion: apps/v1
kind: Deployment
metadata:
  name: sarraf-backend
  labels:
    app: sarraf-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sarraf-backend
  template:
    metadata:
      labels:
        app: sarraf-backend
    spec:
      terminationGracePeriodSeconds: 25 
      # Ensure this KSA has the 'roles/iam.workloadIdentityUser' role
      serviceAccountName: sarraf-backend-ksa
      nodeSelector:
        cloud.google.com/gke-spot: "true"
      containers:
      - name: sarraf-api
        image: me-central1-docker.pkg.dev/omerops-sarraf-dev/sarraf-docker-repo/sarraf-backend:latest 
        ports:
        - containerPort: 8080
        
        # Match the Environment Variables in your main.go
        env:
        - name: DB_HOST
          value: "DATABASE_IP_PLACEHOLDER"
        - name: DB_NAME
          value: "sarraf_interchange"
        - name: DB_USER
          value: "sarraf_admin"
        - name: DB_PORT
          value: "5432"
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: sarraf-db-password-sync
              key: password

        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"

        # Updated to match the '/healthz' path in your Go code
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10

        # Required for the Secret Manager CSI Driver
        volumeMounts:
        - name: secrets-store-inline
          mountPath: "/var/secrets"
          readOnly: true

      # The Volume definition for the CSI Driver
      volumes:
        - name: secrets-store-inline
          csi:
            driver: secrets-store-gke.csi.k8s.io
            readOnly: true
            volumeAttributes:
              secretProviderClass: "sarraf-db-secrets"