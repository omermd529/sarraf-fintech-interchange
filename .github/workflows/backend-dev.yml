name: Backend Dev Deploy

on:
    push:
        branches: [development]
        paths:
            - 'backend/**'

env:
    PROJECT_ID: omerops-sarraf-dev
    REGION: me-central1
    REPO_NAME: sarraf-docker-repo
    IMAGE_NAME: sarraf-api
    CLUSTER_NAME: sarraf-cluster-dev

jobs:
    build-and-deploy:
        name: Build and Deploy to GKE
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Authenticate to Google Cloud
              id: auth
              uses: google-github-actions/auth@v2
              with:
                  workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
                  service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

            - name: Setup Cloud SDK
              uses: google-github-actions/setup-gcloud@v2
              
            - name: Configure Docker for artifact registry
              run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

            # 3. Build and Push using ONLY the unique Git SHA
            - name: Build and Push Docker Image
              run: |
                  # Define the unique tag using the Commit SHA
                  UNIQUE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
                  
                  echo "Building image: $UNIQUE_TAG"
                  docker build -t $UNIQUE_TAG ./backend
                  
                  echo "Pushing unique image to Artifact Registry..."
                  docker push $UNIQUE_TAG
                  
                  # Removed 'latest' tag push to comply with Tag Immutability

            - name: Get GKE Credentials
              uses: google-github-actions/get-gke-credentials@v2
              with:
                  cluster_name: ${{ env.CLUSTER_NAME }}
                  location: ${{ env.REGION }}

            # 5. Deploy to GKE by injecting the SHA-based image path
            - name: Deploy to GKE
              run: |
                # The image path MUST match the one pushed in step 3
                IMAGE_FULL_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
                
                # Replace the placeholder in the manifest
                sed -i "s|IMAGE_PLACEHOLDER|$IMAGE_FULL_PATH|g" backend/k8s/deployment.yaml
                
                # Apply the specific deployment first, then the rest of the folder
                kubectl apply -f backend/k8s/deployment.yaml
                kubectl apply -f backend/k8s/
                
                # Verify the rollout
                kubectl rollout status deployment/sarraf-backend --timeout=300s