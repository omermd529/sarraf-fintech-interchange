apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: sarraf-dev
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: 'sarraf-overview'
      orgId: 1
      folder: 'Sarraf'
      type: file
      disableDeletion: false
      editable: true
      options:
        path: /var/lib/grafana/dashboards/sarraf
    - name: 'sarraf-pods'
      orgId: 1
      folder: 'Sarraf'
      type: file
      disableDeletion: false
      editable: true
      options:
        path: /var/lib/grafana/dashboards/pods
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sarraf-dashboard
  namespace: sarraf-dev
data:
  sarraf-overview.json: |
    {
      "annotations": {"list": []},
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "title": "Sarraf Interchange - Overview",
      "uid": "sarraf-overview",
      "version": 1,
      "panels": [
        {
          "title": "Transactions (Success vs Failed)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "targets": [
            {
              "expr": "rate(sarraf_transactions_total{status=\"completed\"}[5m])",
              "legendFormat": "Completed"
            },
            {
              "expr": "rate(sarraf_transactions_total{status=\"failed\"}[5m])",
              "legendFormat": "Failed"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "palette-classic"},
              "custom": {"fillOpacity": 20, "lineWidth": 2}
            }
          }
        },
        {
          "title": "Payment Latency (p50 / p95 / p99)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "targets": [
            {
              "expr": "histogram_quantile(0.50, rate(sarraf_payment_latency_seconds_bucket[5m]))",
              "legendFormat": "p50"
            },
            {
              "expr": "histogram_quantile(0.95, rate(sarraf_payment_latency_seconds_bucket[5m]))",
              "legendFormat": "p95"
            },
            {
              "expr": "histogram_quantile(0.99, rate(sarraf_payment_latency_seconds_bucket[5m]))",
              "legendFormat": "p99"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {"fillOpacity": 10, "lineWidth": 2}
            }
          }
        },
        {
          "title": "Total Fees Collected (SAR)",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 8},
          "targets": [
            {
              "expr": "sarraf_fee_collected_sar_total",
              "legendFormat": "SAR"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "currencySAR",
              "color": {"mode": "thresholds"},
              "thresholds": {"steps": [{"color": "green", "value": null}]}
            }
          }
        },
        {
          "title": "Total Transactions",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 8},
          "targets": [
            {
              "expr": "sum(sarraf_transactions_total)",
              "legendFormat": "Total"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "color": {"mode": "thresholds"},
              "thresholds": {"steps": [{"color": "blue", "value": null}]}
            }
          }
        },
        {
          "title": "Active Requests",
          "type": "gauge",
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 8},
          "targets": [
            {
              "expr": "sarraf_active_requests",
              "legendFormat": "Active"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "max": 100,
              "thresholds": {
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "yellow", "value": 50},
                  {"color": "red", "value": 80}
                ]
              }
            }
          }
        },
        {
          "title": "Backend Uptime",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 8},
          "targets": [
            {
              "expr": "time() - process_start_time_seconds{job=\"sarraf-backend\"}",
              "legendFormat": "Uptime"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "color": {"mode": "thresholds"},
              "thresholds": {"steps": [{"color": "green", "value": null}]}
            }
          }
        },
        {
          "title": "HTTP Requests by Endpoint",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "targets": [
            {
              "expr": "rate(sarraf_http_requests_total[5m])",
              "legendFormat": "{{method}} {{path}} ({{status_code}})"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {"fillOpacity": 15, "lineWidth": 1}
            }
          }
        },
        {
          "title": "Request Duration by Endpoint (p95)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum(rate(sarraf_http_request_duration_seconds_bucket[5m])) by (le, path))",
              "legendFormat": "{{path}}"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": {"fillOpacity": 10, "lineWidth": 2}
            }
          }
        },
        {
          "title": "Go Goroutines",
          "type": "timeseries",
          "gridPos": {"h": 6, "w": 8, "x": 0, "y": 20},
          "targets": [
            {
              "expr": "go_goroutines{job=\"sarraf-backend\"}",
              "legendFormat": "Goroutines"
            }
          ]
        },
        {
          "title": "Go Memory (Heap)",
          "type": "timeseries",
          "gridPos": {"h": 6, "w": 8, "x": 8, "y": 20},
          "targets": [
            {
              "expr": "go_memstats_heap_alloc_bytes{job=\"sarraf-backend\"}",
              "legendFormat": "Heap Alloc"
            },
            {
              "expr": "go_memstats_heap_sys_bytes{job=\"sarraf-backend\"}",
              "legendFormat": "Heap Sys"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "bytes"}
          }
        },
        {
          "title": "Pod CPU Usage",
          "type": "timeseries",
          "gridPos": {"h": 6, "w": 8, "x": 16, "y": 20},
          "targets": [
            {
              "expr": "rate(process_cpu_seconds_total{job=\"sarraf-backend\"}[5m])",
              "legendFormat": "CPU"
            }
          ],
          "fieldConfig": {
            "defaults": {"unit": "percentunit"}
          }
        }
      ],
      "time": {"from": "now-1h", "to": "now"},
      "refresh": "30s",
      "schemaVersion": 39,
      "templating": {"list": []}
    }
