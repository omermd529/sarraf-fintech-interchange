name: Backend Dev Deploy

on:
    push:
        branches: [development]
        paths:
            - 'backend/**'

env:
    PROJECT_ID: omerops-sarraf-dev
    REGION: me-central1
    REPO_NAME: sarraf-docker-repo
    IMAGE_NAME: sarraf-api
    CLUSTER_NAME: sarraf-cluster-dev

jobs:
    build-and-deploy:
        name: Build, Scan, and Deploy to GKE
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Authenticate to Google Cloud
              id: auth
              uses: google-github-actions/auth@v2
              with:
                  workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
                  service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

            - name: Setup Cloud SDK
              uses: google-github-actions/setup-gcloud@v2
              
            - name: Configure Docker for artifact registry
              run: gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

            # 1. Build the image locally first (so Trivy can scan it)
            - name: Build Local Docker Image
              run: |
                  docker build -t sarraf-api:${{ github.sha }} ./backend

            # 2. THE SECURITY GATE: Scan for Vulnerabilities
            - name: Run Trivy vulnerability scanner
              uses: aquasecurity/trivy-action@master
              with:
                  image-ref: 'sarraf-api:${{ github.sha }}'
                  format: 'table'
                  exit-code: '1' # This forces the pipeline to FAIL if issues are found
                  ignore-unfixed: true # Focus only on bugs that have a patch available
                  vuln-type: 'os,library'
                  severity: 'CRITICAL,HIGH'

            # 3. Push ONLY if the scan above passed (Exit Code 0)
            - name: Push Docker Image to Registry
              run: |
                  REMOTE_TAG="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
                  
                  # Tag the local scanned image for the remote registry
                  docker tag sarraf-api:${{ github.sha }} $REMOTE_TAG
                  
                  echo "Pushing verified image: $REMOTE_TAG"
                  docker push $REMOTE_TAG

            - name: Get GKE Credentials
              uses: google-github-actions/get-gke-credentials@v2
              with:
                  cluster_name: ${{ env.CLUSTER_NAME }}
                  location: ${{ env.REGION }}

            # 5. Deploy to GKE
            - name: Deploy to GKE
              run: |
                IMAGE_FULL_PATH="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO_NAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }}"
                
                sed -i "s|IMAGE_PLACEHOLDER|$IMAGE_FULL_PATH|g" backend/k8s/deployment.yaml
                
                kubectl apply -f backend/k8s/
                
                kubectl rollout status deployment/sarraf-backend --timeout=300s