apiVersion: apps/v1
kind: Deployment
metadata:
  name: sarraf-backend
  labels:
  app: sarraf-backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sarraf-backend
  template:
    metadata:
      labels:
        app: sarraf-backend
    spec:
     serviceAccountName: sarraf-backend-ksa
    # FINOPS: Use Spot instances in Dev
    nodeSelector:
      cloud.google.com/gke-spot: "true"

      containers:
      - name: sarraf-api
      # The pipeline will replace 'IMAGE_PLACEHOLDER' with the actual SHA tag
      image: IMAGE_PLACEHOLDER
      ports:
      - containerPort: 8080
      env:
      - name: GCP_REGION
        value: "me-central1"
      resources:
        requests:
          memory: "512Mi"
          cpu: "250m"
        limits:
          memory: "1Gi"
          cpu: "500m"
      livenessProbe:
        httpGet:
          path: /health
          port: 8080